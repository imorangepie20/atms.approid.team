name: atms
services:
  # [F03] 검사 포트는 내부망 전용이다. 서명 다운로드용 egress와 API 내부 연결을 구분한다.
  clamav:
    image: clamav/clamav:1.4.6_base@sha256:90effb795234e6a93b070310a4bab5a58d93d94b9a077a09ce2229947679782b
    restart: unless-stopped
    environment: { TZ: UTC }
    volumes: [clamav-signatures:/var/lib/clamav]
    networks: [data, scanner-egress]
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 180s
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    env_file: ./secrets/postgres.env
    environment:
      POSTGRES_USER: atms
      POSTGRES_DB: atms
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atms -d atms"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
    logging: &logging
      driver: local
      options: { max-size: "10m", max-file: "3" }

  migrate:
    build: { context: ../server, target: migrate }
    profiles: [tools]
    env_file: ./secrets/migrate.env
    depends_on:
      postgres: { condition: service_healthy }
    networks: [data]
    mem_limit: 512m
    logging: *logging

  api:
    build: { context: ../server, target: runtime }
    restart: unless-stopped
    env_file: ./secrets/api.env
    environment:
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [frontend, data]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4300/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m
    logging: *logging

  app:
    image: nginx:1.30.5-alpine
    restart: unless-stopped
    volumes:
      - ../.artifacts/web:/usr/share/nginx/html:ro
      - ./nginx/atms.conf:/etc/nginx/conf.d/default.conf:ro
    # [F12] 사용자 요청대로 호스트·Nginx·Tunnel 목적지에 동일한 19080 포트를 쓴다.
    ports: ["127.0.0.1:19080:19080"]
    depends_on:
      api: { condition: service_healthy }
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:19080/api/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 64m
    logging: *logging

  tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    profiles: [tunnel]
    restart: unless-stopped
    env_file:
      - path: ./secrets/tunnel.env
        required: false
    command: tunnel --no-autoupdate run
    depends_on:
      app: { condition: service_healthy }
    networks: [frontend]
    mem_limit: 128m
    logging: *logging

networks:
  frontend:
  scanner-egress:
  data:
    internal: true
volumes:
  postgres-data:
  clamav-signatures:
